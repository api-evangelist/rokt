description: Published per-minute limits for the Rokt Partnerships API (accounts.rokt.com). Limits are keyed to
  the partner principal derived from the API token, not IP; all servers sharing credentials share one bucket. No
  published numeric limits were found for the Query, Session, Events or Catalog APIs.
limit_count: 12
exhaustion:
  status: 429
  error_code: RateLimitExceeded
  envelope_example: '{ "status" : 429 , "error" : "RateLimitExceeded" , "message" : "Rate limit exceeded: 10 per
    1 minute. Retry after the window resets." , "request_id" : "...", "data" : null }'
headers:
- name: Retry-After
  'on': '429'
  description: Seconds until the next call will be accepted.
retry_guidance: Honor Retry-After; retry POST/PUT with the same Idempotency-Key inside the 24-hour dedup window;
  poll operations every 2-5 seconds with exponential backoff up to 60 seconds.
