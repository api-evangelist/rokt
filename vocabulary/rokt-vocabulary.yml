  - term: Offers
    definition: Request the offers to render for a transaction. Called once per page view, with whatever customer and transaction context you
      can supply — the richer the context, the better the offer. The response carries the session and page identifiers you echo back when reporting
      events, so keep them for the lifetime of the transaction.
    tags:
    - Resource Group
    source: openapi/rokt-session-api-openapi.yml
  - term: Events
    definition: Report what happened to the offers you rendered. Rokt bills and optimizes on these events, so an integration that renders offers
      without reporting impressions and responses will under-report its own performance and earn less. Events are sent in batches and can partially
      succeed, so check the per-event results rather than the status code alone.
    tags:
    - Resource Group
    source: openapi/rokt-session-api-openapi.yml
