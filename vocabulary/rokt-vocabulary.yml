  terms:
  - term: products
    definition: The Products endpoints give access to every product you have permission to sell on your Partner storefront, and let Brands create,
      update, reorder, and delete the products they supply. To get permission to sell specific products, send proposals to Brands in the [Rokt
      Catalog app](https://app.shopcanal.com/login); once a Brand approves a proposal, its products become available through these endpoin
    tags:
    - Resource Group
    source: openapi/rokt-catalog-api-openapi.yml
  - term: variants
    definition: Variants are the purchasable options of a product (size, color, SKU, price, inventory). Brands add, update, list, and remove variants
      for their own products; Partners receive variant data on the product and through the `product/create` and `product/update` webhooks.
    tags:
    - Resource Group
    source: openapi/rokt-catalog-api-openapi.yml
  - term: orders
    definition: 'The Orders endpoints give access to every order containing Brand products that was purchased from your Partner storefront. **Note**:
      only Rokt Catalog Brand products should appear in these orders. ## Order creation example ```bash curl https://api.shopcanal.com/platform/orders/
      \ --request POST \ --header ''Content-Type: application/json'' \ --header ''Accept: application/json'' \ --header ''x-canal-ap'
    tags:
    - Resource Group
    source: openapi/rokt-catalog-api-openapi.yml
  - term: shops
    definition: Shops are the Brand accounts connected to your Partner storefront. List your active connections, retrieve a connected Brand, or
      request new connections by Brand contact email.
    tags:
    - Resource Group
    source: openapi/rokt-catalog-api-openapi.yml
  - term: fulfillments
    definition: 'The Fulfillments endpoints give access to the latest shipping information for Brand orders placed through your Partner storefront.
      Brands create and update fulfillment (shipment) records; Partners list and retrieve them to show tracking to their customers. **Note**:
      only Rokt Catalog Brand products should appear in these fulfillments.'
    tags:
    - Resource Group
    source: openapi/rokt-catalog-api-openapi.yml
  - term: refunds
    definition: The Refunds endpoints allow the Partner to initiate refunds for Brand products that were bought through the Partner storefront.
      Brands can also create refunds for orders they received, and both roles can list and retrieve refunds.
    tags:
    - Resource Group
    source: openapi/rokt-catalog-api-openapi.yml
  - term: returns
    definition: 'Partners create return requests for items purchased in a Rokt Catalog order and add tracking for the return shipment; Brands
      review the return requests they receive and close them once the returned items have been processed. Closing a return does not create a refund:
      use the Refunds endpoints for that.'
    tags:
    - Resource Group
    source: openapi/rokt-catalog-api-openapi.yml
  - term: shipping-rates
    definition: The Shipping Rates endpoints allow the Partner to determine how much to charge for shipping Brand products that are bought through
      the Partner storefront. Rokt Catalog charges the Partner this amount for shipping and passes it to the Brand. An empty list is returned
      when the line items cannot be shipped to the given location.
    tags:
    - Resource Group
    source: openapi/rokt-catalog-api-openapi.yml
  - term: max-shipping-rates
    definition: Estimate the highest shipping cost for a set of line items before the customer has entered an address, for "Shipping from" style
      displays on a product page.
    tags:
    - Resource Group
    source: openapi/rokt-catalog-api-openapi.yml
  - term: tax
    definition: Calculate estimated tax lines for a set of line items and a shipping address.
    tags:
    - Resource Group
    source: openapi/rokt-catalog-api-openapi.yml
  - term: tax-and-shipping
    definition: Calculate estimated tax lines and available shipping options in a single call during checkout, once the customer has provided
      a shipping address. See [Calculating Tax and Shipping for Shoppable Ads](/developer-reference/product-deep-dives/shoppable-ads/tax-and-shipping/).
    tags:
    - Resource Group
    source: openapi/rokt-catalog-api-openapi.yml
  - term: webhooks
    definition: Register and manage webhook subscriptions so Rokt Catalog can notify your application when products, orders, and fulfillments
      change. See the [Webhooks guide](/integration-guides/ecommerce/catalog/webhooks/) for the available topics, payloads, and delivery behavior.
    tags:
    - Resource Group
    source: openapi/rokt-catalog-api-openapi.yml
  - term: csv
    definition: 'CSV downloads: the product import template, and line-item exports for Partners and Brands. These endpoints back the upload and
      export flows in the Rokt Catalog app and expect a signed-in app session; use the Products and Variants endpoints with the API headers for
      programmatic catalog changes.'
    tags:
    - Resource Group
    source: openapi/rokt-catalog-api-openapi.yml
  - term: markets
    definition: Import market-specific prices for your products. These endpoints back the upload and export flows in the Rokt Catalog app and
      expect a signed-in app session; use the Products and Variants endpoints with the API headers for programmatic catalog changes.
    tags:
    - Resource Group
    source: openapi/rokt-catalog-api-openapi.yml
