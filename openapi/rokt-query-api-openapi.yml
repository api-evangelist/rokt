paths:
  /v1/query/accounts/:
    get:
      tags:
      - accounts
      summary: Get User Accounts
      description: "Retrieve all accounts associated with the authenticated user.\n\nThis endpoint returns a list of all accounts that the authenticated\n\
        user has access to.\nThe response includes account details such as account ID, name, country, currency,\nand timezone information.\n\n\
        ## Authentication\nRequires a valid Bearer token from a user's Rokt JWT or encoded OAuth2 token.\nFor more information about authenticating\
        \ with our API, see the\n[Authentication](https://docs.rokt.com/developer-reference/apis/reporting-apis/query-api/api-reference/#section/Authentication)\n\
        documentation.\n\n## Response\nReturns a list of account objects with the following structure:\n- `accountId`: Unique identifier for the\
        \ account\n- `accountName`: Display name of the account\n- `countryCode`: ISO country code for the account\n- `accountOwner`: Email address\
        \ of the account owner (optional)\n- `accountCurrencyCode`: Currency code for the account\n- `accountTimezone`: Timezone name for the\
        \ account\n- `accountTimezoneOffset`: Timezone offset in minutes\n\n## Error Responses\n- `401 Unauthorized`: Failed to authenticate.\
        \ Invalid token.\n- `404 Not Found`: User does not have any accounts\n- `500 Internal Server Error`: Server error while retrieving accounts\n\
        \n## Example Response\n```json\n[\n    {\n        \"accountId\": \"acc_123456789\",\n        \"accountName\": \"Example Account 1\",\n\
        \        \"countryCode\": \"US\",\n        \"accountOwner\": \"user@example.com\",\n        \"accountCurrencyCode\": \"USD\",\n      \
        \  \"accountTimezone\": \"America/New_York\",\n        \"accountTimezoneOffset\": -300\n    },\n    {\n        \"accountId\": \"acc_123456790\"\
        ,\n        \"accountName\": \"Example Account 2\",\n        \"countryCode\": \"AU\",\n        \"accountOwner\": \"user@example.com\",\n\
        \        \"accountCurrencyCode\": \"AUD\",\n        \"accountTimezone\": \"Australia/Sydney\",\n        \"accountTimezoneOffset\": 600\n\
        \    }\n]\n```"
      operationId: get_user_accounts_v1_query_accounts__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AccountExternal'
                type: array
                title: Response Get User Accounts V1 Query Accounts  Get
        '401':
          description: Failed to authenticate. Invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: User does not have any accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '500':
          description: An unexpected error occurred. Please validate your request is correct and try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /v1/query/accounts/{account_id}:
    get:
      tags:
      - accounts
      summary: Get Account
      description: "Retrieve detailed information for a specific account.\n\nThis endpoint returns detailed information about a specific account\
        \ identified\nby the account_id parameter.\nThe user must have access permissions to the specified account.\n\n## Parameters\n- `accountId`\
        \ (path): The unique identifier of the account to retrieve\n\n## Authentication\nRequires a valid Bearer token from a user's Rokt JWT\
        \ or encoded OAuth2 token.\nFor more information about authenticating with our API, see the\n[Authentication](https://docs.rokt.com/developer-reference/apis/reporting-apis/query-api/api-reference/#section/Authentication)\n\
        documentation.\nThe user must have access permissions to the specified account and campaign data.\n\n## Response\nReturns a single account\
        \ object with the following structure:\n- `accountId`: Unique identifier for the account\n- `accountName`: Display name of the account\n\
        - `countryCode`: ISO country code for the account\n- `accountOwner`: Email address of the account owner (optional)\n- `accountCurrencyCode`:\
        \ Currency code for the account\n- `accountTimezone`: Timezone name for the account\n- `accountTimezoneOffset`: Timezone offset in minutes\n\
        \n## Error Responses\n- `401 Unauthorized`: Failed to authenticate. Invalid token.\n- `403 Forbidden`: User does not have access to the\
        \ specified account\n- `404 Not Found`: Account with the specified ID does not exist\n- `500 Internal Server Error`: Server error while\
        \ retrieving account\n\n## Example Request\n```\nGET /v1/query/accounts/acc_123456789\n```\n\n## Example Response\n```json\n{\n    \"\
        accountId\": \"acc_123456789\",\n    \"accountName\": \"Example Account 1\",\n    \"countryCode\": \"US\",\n    \"accountOwner\": \"user@example.com\"\
        ,\n    \"accountCurrencyCode\": \"USD\",\n    \"accountTimezone\": \"America/New_York\",\n    \"accountTimezoneOffset\": -300\n}\n```"
      operationId: get_account_v1_query_accounts__account_id__get
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: integer
          title: Account Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountExternal'
        '401':
          description: Failed to authenticate. Invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '403':
          description: User does not have access to the specified account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: Account with the specified ID does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: An unexpected error occurred. Please validate your request is correct and try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /v1/query/accounts/{account_id}/campaigns/:
    post:
      tags:
      - campaigns
      summary: Get Advertiser Report
      description: "Generate a comprehensive campaign report for the specified account.\n\nThis endpoint allows you to query campaign performance\
        \ data with flexible filtering,\nmetrics selection, and date range specification. The response includes aggregated\ncampaign data based\
        \ on your specified criteria.\n\n## Parameters\n- `account_id` (path): The unique identifier of the account for which\nto generate the\
        \ report\n\n## Request Body\nThe request body should contain a `ReportingRequestExternal` object\nwith the following fields:\n- `timezoneVariation`\
        \ (string, optional): Timezone for the report data\n(default: \"America/New_York\")\n- `currencyCode` (string, optional): Currency code\
        \ for the report data\n(default: \"USD\")\n- `interval` (string, optional): Time interval for the report data.\nOptions: \"day\", \"week\"\
        , \"month\", \"year\"\n- `startDate` (string): Start date for the report period in ISO format (inclusive).\nAccepts both YYYY-MM-DD and\
        \ YYYY-MM-DD HH:MM:SS\n- `endDate` (string): End date for the report period in ISO format (exclusive).\nAccepts both YYYY-MM-DD and YYYY-MM-DD\
        \ HH:MM:SS\n- `dimensionFilters` (object, optional): Filters to apply to specific dimensions\n- `metrics` (array): List of metrics to\
        \ include in the report. \nFor available metrics, use the slugs returned from the `get_help` endpoint.\n- `dimensions` (array, optional):\
        \ Dimensions to group the data by.\nFor available dimensions, use the slugs returned from the `get_help` endpoint.\n- `orderBys` (array,\
        \ optional): Sorting criteria for the results.\nAccepts both \"column\" and \"direction\" keys.\n- `limit` (integer, optional): Maximum\
        \ number of results to return\n\n## Authentication\nRequires either a valid JWT Bearer token or Cognito token in the request headers.\n\
        For more information about authenticating with our API, see the\n[Authentication](https://docs.rokt.com/developer-reference/apis/reporting-apis/query-api/#authentication)\n\
        documentation.\nThe user must have access permissions to the specified account and campaign data.\n\n## Response\nReturns a `ReportingResponseExternal`\
        \ object containing:\n- `data`: Array of requested campaign metrics and dimensions.\nIf interval is provided, each object will contain\
        \ a `datetime` field\ndenoting the start of the provided interval.\n- `accountId`: The account ID for which the report was generated\n\
        - `queryTimeMs`: Query execution time in milliseconds\n\n## Error Responses\n- `400 Bad Request`: Invalid request parameters or filters\n\
        - `401 Unauthorized`: Failed to authenticate. Invalid token.\n- `403 Forbidden`: User does not have access to the specified account\n\
        - `404 Not Found`: The requested resource was not found.\n    Please validate your request is correct and try again.\n- `500 Internal\
        \ Server Error`: Server error while generating report\n\n## Example Request\n```json\n{\n    \"timezoneVariation\": \"America/New_York\"\
        ,\n    \"currencyCode\": \"USD\",\n    \"interval\": \"day\",\n    \"startDate\": \"2025-03-04\",\n    \"endDate\": \"2025-03-05\",\n\
        \    \"dimensionFilters\": {\n        \"campaign_id\": [\"3427232771076128951\"]\n    },\n    \"metrics\": [\"impressions\", \"referrals\"\
        , \"gross_cost\"],\n    \"dimensions\": [\"campaign_id\", \"creative_id\", \"age_group\"],\n    \"orderBys\": [\n        {\n         \
        \   \"column\": \"referrals\",\n            \"direction\": \"desc\"\n        }\n    ]\n}\n```\n\n## Example Response\n```json\n{\n   \
        \ \"data\": [\n        {\n            \"datetime\": \"2025-03-04T00:00:00Z\",\n            \"impressions\": 1501.0,\n            \"referrals\"\
        : 205.0,\n            \"gross_cost\": 410.05,\n            \"campaign_id\": \"3427232771076128951\",\n            \"creative_id\": \"\
        3427232968644886703\",\n            \"age_group\": \"26-35\"\n        },\n        {\n            \"datetime\": \"2025-03-04T00:00:00Z\"\
        ,\n            \"impressions\": 1220.0,\n            \"referrals\": 180.0,\n            \"gross_cost\": 300.00,\n            \"campaign_id\"\
        : \"3401676908203081730\",\n            \"creative_id\": \"3404563830614458492\",\n            \"age_group\": \"36-45\"\n        }\n \
        \   ],\n    \"accountId\": \"3286272607917027328\",\n    \"queryTimeMs\": 206\n    }\n```"
      operationId: get_advertiser_report_v1_query_accounts__account_id__campaigns__post
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: integer
          title: Account Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportingRequestExternal'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportingResponseExternal'
        '400':
          description: Invalid request parameters or filters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          description: Failed to authenticate. Invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: The requested resource was not found. Please validate your request is correct and try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Server error while generating report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /v1/query/accounts/{account_id}/campaigns/help:
    get:
      tags:
      - campaigns
      summary: Get Help
      description: "Retrieve available metrics and dimensions for campaign reporting.\n\nThis endpoint returns metadata about the available reporting\
        \ options, including\nwhich metrics and dimensions can be used together, their display names, and\nany additional configuration options.\n\
        \n## Parameters\n- `account_id` (path): The unique identifier of the account\n(used for access validation)\n\n## Authentication\nRequires\
        \ a valid Bearer token from a user's Rokt JWT or encoded OAuth2 token.\nFor more information about authenticating with our API, see the\n\
        [Authentication](https://docs.rokt.com/developer-reference/apis/reporting-apis/query-api/api-reference/#section/Authentication)\ndocumentation.\n\
        The user must have access permissions to the specified account and campaign data.\n\n## Response\nReturns a `ReportingMetadataExternal`\
        \ object containing:\n- `dimensions`: List of dimensions with their slugs and descriptions\n- `metrics`: List of metrics with their slugs\
        \ and descriptions\n\n## Error Responses\n- `401 Unauthorized`: Failed to authenticate. Invalid token.\n- `403 Forbidden`: User does not\
        \ have access to the specified account\n- `404 Not Found`: The requested resource was not found.\n    Please validate your request is\
        \ correct and try again.\n- `500 Internal Server Error`: Server error while retrieving metadata\n\n## Example Response\n```json\n{\n \
        \ \"dimensions\": [\n      {\n          \"slug\": \"age_range\",\n          \"description\": \"The age range of the user\"\n      },\n\
        \      {\n          \"slug\": \"campaign_id\",\n          \"description\": \"The ID of the campaign\"\n      },\n      {\n          \"\
        slug\": \"creative_id\",\n          \"description\": \"The ID of the creative\"\n      },\n      {\n          \"slug\": \"device\",\n\
        \          \"description\": \"The device of the user\"\n      },\n  ],\n  \"metrics\": [\n      {\n          \"slug\": \"impressions\"\
        ,\n          \"description\": \"The number of ad impressions\"\n      },\n      {\n          \"slug\": \"referrals\",\n          \"description\"\
        : \"The number of positive engagements with the ad\"\n      },\n      {\n          \"slug\": \"clickthru_acquisitions\",\n          \"\
        description\": \"The number of click-thru acquisitions for the ad.\n          An acquisition represents the first conversion\n       \
        \   following an engagement event.\"\n      },\n      {\n          \"slug\": \"cpa\",\n          \"description\": \"The Cost per Acquisition\
        \ for the ad\"\n      },\n      {\n          \"slug\": \"gross_cost\",\n          \"description\": \"The gross cost (spend) for the ad\"\
        \n      },\n  ]\n}\n```"
      operationId: get_help_v1_query_accounts__account_id__campaigns_help_get
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: integer
          title: Account Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportingMetadataExternal'
        '401':
          description: Failed to authenticate. Invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: The requested resource was not found. Please validate your request is correct and try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Server error while generating report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /v1/query/accounts/{account_id}/transactions:
    post:
      tags:
      - transactions
      summary: Get Partner Report
      description: "Generate a comprehensive transaction report for the specified account.\n\nThis endpoint allows you to query transaction data\
        \ with flexible filtering,\nmetrics selection, and date range specification. The response includes aggregated\ntransaction data based\
        \ on your specified criteria.\n\n## Parameters\n- `account_id` (path): The unique identifier of the account for which\nto generate the\
        \ report\n\n## Request Body\nThe request body should contain a `ReportingRequestExternal` object\nwith the following fields:\n- `timezoneVariation`\
        \ (string, optional): Timezone for the report data\n(default: \"America/New_York\")\n- `currencyCode` (string, optional): Currency code\
        \ for the report data\n(default: \"USD\")\n- `interval` (string, optional): Time interval for the report data.\nOptions: \"day\", \"week\"\
        , \"month\", \"year\"\n- `startDate` (string): Start date for the report period in ISO format (inclusive).\nAccepts both YYYY-MM-DD and\
        \ YYYY-MM-DD HH:MM:SS\n- `endDate` (string): End date for the report period in ISO format (exclusive).\nAccepts both YYYY-MM-DD and YYYY-MM-DD\
        \ HH:MM:SS\n- `dimensionFilters` (object, optional): Filters to apply to specific dimensions\n- `metrics` (array): List of metrics to\
        \ include in the report.\nFor available metrics, use the slugs returned from the `get_help` endpoint.\n- `dimensions` (array, optional):\
        \ Dimensions to group the data by.\nFor available dimensions, use the slugs returned from the `get_help` endpoint.\n- `orderBys` (array,\
        \ optional): Sorting criteria for the results.\nAccepts both \"column\" and \"direction\" keys.\n- `limit` (integer, optional): Maximum\
        \ number of results to return\n\n## Authentication\nRequires either a valid JWT Bearer token or Cognito token in the request headers.\n\
        For more information about authenticating with our API, see the\n[Authentication](https://docs.rokt.com/developer-reference/apis/reporting-apis/query-api/#authentication)\n\
        documentation.\nThe user must have access permissions to the specified account and transaction data.\n\n## Response\nReturns a `ReportingResponseExternal`\
        \ object containing:\n- `data`: Array of requested transaction metrics and dimensions.\nIf interval is provided, each object will contain\
        \ a `datetime` field\ndenoting the start of the provided interval.\n- `accountId`: The account ID for which the report was generated\n\
        - `queryTimeMs`: Query execution time in milliseconds\n\n## Error Responses\n- `400 Bad Request`: Invalid request parameters or filters\n\
        - `401 Unauthorized`: Failed to authenticate. Invalid token.\n- `403 Forbidden`: User does not have access to the specified account\n\
        - `404 Not Found`: The requested resource was not found.\n    Please validate your request is correct and try again.\n- `500 Internal\
        \ Server Error`: Server error while generating report\n\n## Example Request\n```json\n{\n    \"timezoneVariation\": \"America/New_York\"\
        ,\n    \"currencyCode\": \"USD\",\n    \"interval\": \"day\",\n    \"startDate\": \"2025-03-04\",\n    \"endDate\": \"2025-03-05\",\n\
        \    \"dimensionFilters\": {\n        \"page_type\": [\"confirmation\"]\n    },\n    \"metrics\": [\"impressions\", \"referrals\", \"\
        total_page_transactions\"],\n    \"dimensions\": [\"display_type\", \"page_type\", \"age_range\"],\n    \"orderBys\": [\n        {\n \
        \           \"column\": \"referrals\",\n            \"direction\": \"desc\"\n        }\n    ]\n}\n```\n\n## Example Response\n```json\n\
        {\n    \"data\": [\n        {\n            \"datetime\": \"2025-03-04T00:00:00Z\",\n            \"impressions\": 1501.0,\n           \
        \ \"referrals\": 205.0,\n            \"total_page_transactions\": 1600.0,\n            \"display_type\": \"desktop\",\n            \"\
        page_type\": \"confirmation\",\n            \"age_range\": \"26-35\"\n        },\n        {\n            \"datetime\": \"2025-03-04T00:00:00Z\"\
        ,\n            \"impressions\": 1220.0,\n            \"referrals\": 180.0,\n            \"total_page_transactions\": 1400.0,\n       \
        \     \"display_type\": \"mobile\",\n            \"page_type\": \"confirmation\",\n            \"age_range\": \"36-45\"\n        }\n \
        \   ],\n    \"accountId\": \"3286272607917027328\",\n    \"queryTimeMs\": 206\n    }\n```"
      operationId: get_partner_report_v1_query_accounts__account_id__transactions_post
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: integer
          title: Account Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportingRequestExternal'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportingResponseExternal'
        '400':
          description: Invalid request parameters or filters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          description: Failed to authenticate. Invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: The requested resource was not found. Please validate your request is correct and try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Server error while generating report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /v1/query/accounts/{account_id}/transactions/help:
    get:
      tags:
      - transactions
      summary: Get Help
      description: "Retrieve available metrics and dimensions for transaction reporting.\n\nThis endpoint returns metadata about the available\
        \ reporting options, including\nwhich metrics and dimensions can be used together, their display names, and\nany additional configuration\
        \ options.\n\n## Parameters\n- `account_id` (path): The unique identifier of the account\n(used for access validation)\n\n## Authentication\n\
        Requires a valid Bearer token from a user's Rokt JWT or encoded OAuth2 token.\nFor more information about authenticating with our API,\
        \ see the\n[Authentication](https://docs.rokt.com/developer-reference/apis/reporting-apis/query-api/api-reference/#section/Authentication)\n\
        documentation.\nThe user must have access permissions to the specified account and transaction data.\n\n## Response\nReturns a `ReportingMetadataExternal`\
        \ object containing:\n- `dimensions`: List of dimensions with their slugs and definitions\n- `metrics`: List of metrics with their slugs\
        \ and definitions\n\n## Error Responses\n- `401 Unauthorized`: Failed to authenticate. Invalid token.\n- `403 Forbidden`: User does not\
