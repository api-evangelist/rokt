info:
  description: "# Introduction\nThe Rokt Query API is a comprehensive and flexible API for querying account data,\ncampaigns, and transactions.\n\
    \n# Authentication\nThe Rokt Query API leverages the OAuth 2.0 approach to client integration. \nSee the [OAuth 2.0 Credentials Flow](https://auth0.com/docs/flows/client-credentials-flow)\
    \ for more details. \nYou need to use your Rokt App ID and App Secret to access the Query API.\n\n## Generating a Rokt App ID and App Secret\n\
    \n1. Sign in to One Platform at [my.rokt.com](https://my.rokt.com)\n2. Navigate to **Profile Settings** under your account icon at the bottom\
    \ left\n3. Scroll down to the **Generate Personal API Credentials** section\n4. Enter the name of your app and click **Generate**\n5. Store\
    \ the App ID and App Secret securely - you will not have access to the App Secret again\n\n## Generating an Access Token\n\nRokt uses OAuth\
    \ 2.0 for secure authentication to our public APIs. This is to ensure that only authorized users can access their data.\n\nTo generate an\
    \ access token, make the following POST request.\n\n```cURL\ncurl -X POST https://api.rokt.com/auth/oauth2/token \\\n--header \"Authorization:\
    \ Basic $ENCODED_TOKEN\" \\\n--header \"Content-Type: application/x-www-form-urlencoded\" \\\n--data \"grant_type=client_credentials\"\n```\n\
    \nThe access token expires after one hour, and must be included as a Bearer token in all API requests.\n\n### Step-by-Step Example\n\nHere's\
    \ a complete example using shell commands:\n```bash\n# Step 1: Set your environment variables. Do not store these in version control\nexport\
    \ ROKT_APP_ID=\"your_app_id\"\nexport ROKT_APP_SECRET=\"your_secret\"\n\n# Step 2: Encode your credentials to generate an auth token\nexport\
    \ ENCODED_TOKEN=$(printf '%s' \"${ROKT_APP_ID}:${ROKT_APP_SECRET}\" | openssl base64 | tr -d '\\n')\n\n# Step 3: Request OAuth2/Bearer token\
    \ using Basic Auth with the encoded token\nBEARER_TOKEN=$(curl -s -X POST https://api.rokt.com/auth/oauth2/token       -H \"Authorization:\
    \ Basic $ENCODED_TOKEN\"       -H \"Content-Type: application/x-www-form-urlencoded\"       -d \"grant_type=client_credentials\" | jq -r '.access_token')\n\
    \n# Step 4: Use the Bearer token in Query API requests\ncurl -X GET \"https://api.rokt.com/v1/query/accounts\" \\\n  --header 'Content-Type:\
    \ application/json' \\\n  --header \"Authorization: Bearer $BEARER_TOKEN\"\n```\n\n## Important Notes\n- Always use environment variables\
    \ for credentials to avoid exposing them in scripts or version control\n- The `printf` command with `openssl base64` ensures proper encoding\
    \ without newline characters\n- Store the access token securely as it provides full API access until expiration\n\n# Rate Limiting\nAPI requests\
    \ are rate-limited to ensure fair usage and system stability.\n\n# Error Handling\nThe API returns standardized error responses with appropriate\
    \ HTTP status codes.\n"
