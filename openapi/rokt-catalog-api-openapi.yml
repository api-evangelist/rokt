              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /orders/v1/initialize-order/:
    post:
      tags:
      - orders
      summary: Initialize an order
      operationId: orders_v1_initialize_order_create
      description: '**[Storefront Only]** Create a new order and receive a Stripe PaymentIntent client secret for frontend payment confirmation.


        This endpoint allows Storefronts to initiate order creation and receive a Stripe `client_secret`, which must be passed to the Stripe frontend
        payment element (such as Stripe Elements) to collect payment authorization from the customer.


        The request payload mirrors the standard post purchase upsell order creation structure, but payment details are not required.


        **Process:**


        1. **Validation:** Ensures input variants are valid, active, and listed by the supplier. If variants are paused, unlisted, or invalid,
        returns `422 Unprocessable Entity`. If the input data format is invalid, returns `400 Bad Request`.


        2. **Stripe PaymentIntent Creation:** Generates a Stripe PaymentIntent and returns its `client_secret`. The client secret must be used
        with the Stripe frontend integration to complete payment.


        3. **Order Creation:** Creates the primary Storefront order record in Catalog, associated with the PaymentIntent.


        4. **Supplier Dispatch:** After payment confirmation from the frontend, supplier orders are asynchronously dispatched.


        **Responses & Errors:**


        **Response:** On success, returns order details and the Stripe `client_secret` for the PaymentIntent. The frontend must use this secret
        to proceed with payment authorization.


        **Error Handling:** Returns specific errors for failed validation, payment intent creation issues, or unexpected exceptions (such as dispatch
        or database failures). If payment intent creation fails, order creation will not proceed.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostPurchaseOrderCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PostPurchaseOrderCreate'
