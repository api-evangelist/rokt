  /orders/create_or_get/:
    post:
      tags:
      - orders
      summary: Create or get an order
      operationId: orders_create_or_get_create
      description: '**[Storefront Only]** Safely create or retrieve a Catalog order using your Storefront''s unique order identifier (`order_name`)
        to ensure idempotency.


        **Behavior:**


        1. **Check Existing:** The system first queries for an existing active (non-cancelled) order associated with your shop that matches the
        provided `order_name`.


        2. **Return Existing:** If exactly one such active order is found, the endpoint immediately returns `200 OK` with the details of that
        existing order (`OrderSerializer`). This prevents duplicate creation.


        3. **Handle Duplicates:** If multiple active orders are found with the same `order_name` (which indicates a potential issue), it returns
        a `400 Bad Request` validation error.


        4. **Create New:** If no active order with the given `order_name` is found, the endpoint proceeds to call the standard `create` method
        (the `/orders/` POST endpoint logic) using the **entire request payload**.


        **Payload Requirement:** Even though this endpoint might retrieve an existing order, you **must** provide the full order creation payload
        (identical to the standard `/orders/` create request) in the request body. This payload is used only if a new order needs to be created.


        **Use Case:** This endpoint is ideal for scenarios where order creation requests might be retried (e.g., due to network issues). It guarantees
        that submitting the same request multiple times will result in only one Catalog order being created.


        **Responses & Errors:** If creating a new order, the responses (`201 Created`, `202 Accepted`) and potential errors (`400`, `422`, `500`,
        `503`) are identical to those of the standard `create` endpoint.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrderCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrderCreate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /orders/v1/create-and-charge/:
    post:
      tags:
      - orders
      summary: Create and charge an order
      operationId: orders_v1_create_and_charge_create
      description: '**[Storefront Only]** Create a new order with immediate payment processing.



        This endpoint combines order creation and payment processing in a single request.


        The request body follows the same structure as the standard order creation endpoint, with additional payment fields.


        **Process:**


        1. **Validation:** Checks if input variants are valid, active, and listed by the supplier. If variants are paused or unlisted, returns
        `422 Unprocessable Entity`. Basic format validation returns `400 Bad Request`.


        2. **Payment Processing:** Processes the payment with a third party payment service provider.


        3. **Storefront Order Creation:** Creates the primary order record in Catalog representing the Storefront''s view of the order.


        4. **Supplier Order Dispatch:** Schedules an **asynchronous** task to forward order details to relevant Suppliers. Returns `202 Accepted`
        with the created Storefront order data.


        **Responses & Errors:**


        **Response:** Returns the created order details on success, or payment/validation errors on failure.


        **Error Handling:** Catches various exceptions, including dispatch errors, database connection issues, and general exceptions, logging
        them and potentially returning `500 Internal Server Error`. If payment fails, will not continue with order creation.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateAndCharge'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrderCreateAndCharge'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrderCreateAndCharge'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreateAndChargeV1Response'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreateAndChargeV1Response'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
