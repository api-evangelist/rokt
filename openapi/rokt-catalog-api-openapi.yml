  /orders/{id}/cancel/:
    post:
      tags:
      - orders
      summary: Cancel an order
      operationId: orders_cancel_create
      description: '**[Storefront Only]** Cancel a Rokt Catalog order associated with your Storefront.


        Identify the order to be cancelled by its Catalog `ID` (UUID) provided in the URL path.


        **Process:**


        1. **Update Storefront Order:** Sets the `cancelled_at` field on the Storefront''s order record in Catalog to the current timestamp.


        2. **Cancel Supplier Orders:** Triggers an **asynchronous** operation. This attempts to cancel the corresponding order(s) that were previously
        dispatched to the relevant Supplier(s)'' external platforms (e.g., calling the Shopify API to cancel the order on the Supplier''s store).


        3. **Webhook:** Emits an `ORDER_CANCEL` webhook event containing the details of the cancelled Storefront order.


        **Permissions:** Requires valid platform integration settings for the Storefront. If settings are missing, returns `403 Forbidden`.


        A successful cancellation returns `200 OK` with the updated Storefront order details (`OrderSerializer`), including the `cancelled_at`
        timestamp.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      responses:
