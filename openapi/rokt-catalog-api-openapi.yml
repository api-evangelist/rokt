      summary: Calculate tax and shipping
      operationId: tax_and_shipping_calculate_create
      description: "**[Storefront Only]** Calculate estimated tax lines and available shipping options and costs, given a set of line items, shipping\
        \ address, and optionally a billing address.\n\nThis endpoint is typically used during the checkout process after the customer has provided\
        \ their shipping address.\n\n**Request Body (`TaxCalculationQuerySerializer`):**\n\n- `line_items` (list, required): A list of objects,\
        \ each specifying:\n\n  - `variant_id` (UUID, required): The Catalog ID of the *Storefront's* variant record.\n\n  - `quantity` (integer,\
