      description: '**[Supplier Only]** Create a new product listing within your Rokt Catalog Supplier account. This makes the product manageable
        through Catalog and potentially available to your connected Storefront partners.


        The request body must conform to the `PushProductSerializer` structure. Key fields include:


        `title` (string, required), `body_html` (string, product description), `product_type` (string), `vendor` (string), `tags` (string, comma-separated),
        and a list of `variants` (required, at least one).


        Each object in the `variants` list requires `price` (decimal string), `sku` (string), `inventory_quantity` (integer), and option values
        (`option1`, `option2`, `option3`). `compare_at_price` (decimal string) is optional for sale pricing.


        You can also include a list of `images`, each with a `src` (URL) and optional `position`.


        Successfully creating a product (HTTP `201 Created`) makes it visible in your Catalog dashboard. Its availability to Storefronts depends
        on its listing status (`supplier_has_listed_on_canal` flag on variants) and the terms established with each partner.


        The response body contains the full details of the newly created product and its variants, including their assigned Catalog IDs (UUIDs),
