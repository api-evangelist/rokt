        \ Request:** Creates the primary return request record associated with the Storefront's order in Rokt Catalog.\n\n3. **Create Initial\
        \ Tracking (Optional):** If `reverse_deliveries` are provided, creates associated return tracking records.\n\n4. **Dispatch to Suppliers\
        \ (Async):** Triggers an **asynchronous** task to create corresponding return request records for each relevant Supplier involved in the\
        \ returned line items. These Supplier return requests are linked back to the Storefront's request.\n\n**Error Handling:** Returns `400\
        \ Bad Request` for validation errors (e.g., invalid quantity, bad IDs). Returns `500 Internal Server Error` for unexpected issues.\n\n\
        **Response:** On success, returns `201 Created` with the details of the newly created **Storefront** return request (`ReturnSerializer`)."
