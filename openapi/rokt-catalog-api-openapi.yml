  /variants/:
    get:
      tags:
      - variants
      summary: List variants
      operationId: variants_list
      description: '**[Supplier Only]** Retrieve a paginated list of **all** product variants associated with **all** products owned by your Supplier
        account.


        This endpoint provides a flat list of variant details, independent of their parent products. Use this if you need to query or manage variants
        across your entire catalog.


        Results are returned using cursor-based pagination (`PlatformPagination`). Available ordering fields include `created_at`, `updated_at`,
        `price`, and `compare_at_price`. The default order is `-created_at`.'
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVariantList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    post:
      tags:
      - variants
      summary: Create a variant
      operationId: variants_create
      description: '**[Supplier Only]** Add a new variant to an existing product within your Rokt Catalog Supplier account.


        The request body must conform to the `CreateVariantSerializer` structure, requiring the `product_id` (UUID) of the parent product and
        the full details of the new variant (including `price`, `sku`, `inventory_quantity`, `option1`, etc.).


        Upon successful creation, the new variant is added to the specified product. By default, it will be assigned the next available `position`
        (typically appearing last in the variant list, unless explicitly reordered later using the `/products/{product_id}/reorder_variants/`
        endpoint).


        **Synchronization:** This addition is automatically propagated **asynchronously** to connected Storefronts that are selling the parent
        product.


        A successful creation returns `201 Created` with the full details of the **parent product** (`ProductSerializer`), now including the newly
        added variant and its assigned Catalog ID (UUID).'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVariant'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateVariant'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateVariant'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /variants/{id}/:
    get:
      tags:
      - variants
      summary: Retrieve a variant
      operationId: variants_retrieve
      description: '**[Supplier Only]** Retrieve the full details for a specific product variant, identified by its Rokt Catalog `ID` (UUID) provided
        in the URL path.


        This endpoint returns data only for variants that belong to products owned by your Supplier account.


        The response (`VariantSerializer`) includes all attributes of the variant, such as price, SKU, inventory, options, weight, timestamps,
        and its parent product ID.


        If the provided variant `ID` is invalid or belongs to a product owned by another shop, a `404 Not Found` error is returned.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Variant'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    put:
      tags:
      - variants
      summary: Update a variant
      operationId: variants_update
      description: '**[Supplier Only]** Update attributes of a specific product variant, identified by its Rokt Catalog `ID` (UUID) in the URL
        path.


        Provide the fields you wish to change in the request body using the `VariantSerializer` structure (partial updates are allowed). Common
        updatable fields include `price`, `compare_at_price`, `sku`, `inventory_quantity`, `option1`, `option2`, `option3`, `weight`, `weight_unit`,
        etc.


        **Synchronization:** Changes to critical attributes like price and inventory are automatically propagated to connected Storefronts that
        are selling this variant. This synchronization occurs **asynchronously**.


        **Pricing Update:** When updating `price` or `compare_at_price`, the system also updates the associated variant listing''s default price,
        considering the shop''s feature flags for sale price syncing.


        A successful update returns `200 OK` with the full details of the **parent product** (`ProductSerializer`), reflecting the changes made
        to the specific variant.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Variant'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Variant'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Variant'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    patch:
      tags:
      - variants
      summary: Partially update a variant
      operationId: variants_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedVariant'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedVariant'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedVariant'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Variant'
          description: ''
    delete:
      tags:
      - variants
      summary: Delete a variant
      operationId: variants_destroy
      description: '**[Supplier Only]** Permanently remove a specific product variant, identified by its Rokt Catalog `ID` (UUID) in the URL path,
        from its parent product.


        **Warning:** This action is **irreversible**.


        **Constraint:** You **cannot** delete the last remaining variant of a product using this endpoint. If you need to remove the product entirely,
        use the `/products/{product_id}/` delete endpoint instead.


        **Synchronization:** Deleting a variant automatically triggers an **asynchronous** update (emitting a `PRODUCT_UPDATE` webhook) to propagate
        this change to connected Storefronts, effectively removing the variant from their listings.


        **Position Update:** The `position` attribute of the remaining variants on the parent product will be automatically recalculated and updated
        to maintain a contiguous sequence.


        A successful deletion returns `200 OK` with the full details of the **parent product** (`ProductSerializer`), reflecting the variant''s
        removal and the updated positions of the remaining variants.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /webhooks/:
    get:
      tags:
      - webhooks
      summary: List webhooks
      operationId: webhooks_list
      description: 'Retrieve a paginated list of all webhook subscriptions currently registered and active for the authenticated application (identified
        by the API credentials used in the request).


        The response (`RegisteredWebhookSerializer`, paginated) includes the unique Rokt Catalog `ID` (UUID), the subscribed `topic`, and the
        target `address` (URL) for each registered webhook.


        Results are returned using cursor-based pagination (`PlatformPagination`).'
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRegisteredWebhookList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    post:
      tags:
      - webhooks
      summary: Create a webhook
      operationId: webhooks_create
      description: 'Register a new endpoint URL to receive notifications (webhooks) from Rokt Catalog when specific events occur related to your
        store.


        The request body (`CreateUpdateWebhookSerializer`) requires:


        `topic`: A string representing the event type you want to subscribe to (e.g., `product/update`, `order/cancel`, `fulfillment/update`).
        See Catalog documentation for the full list of available topics.


        `address`: The HTTPS URL of your application''s endpoint that will receive the webhook POST requests from Catalog.


        **Process:** Catalog validates the topic and creates a webhook subscription record associated with your application''s integration settings.
        When an event matching the `topic` occurs for a resource linked to your store (e.g., an order associated with your shop is cancelled),
        Catalog will send an HTTP POST request containing the relevant event payload (JSON format) to the registered `address`.


        A successful registration returns `201 Created` with the details of the new subscription (`RegisteredWebhookSerializer`), including its
        unique Catalog `ID` (UUID).'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUpdateWebhook'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateUpdateWebhook'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateUpdateWebhook'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredWebhook'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /webhooks/{id}/:
    get:
      tags:
      - webhooks
      summary: Retrieve a webhook
      operationId: webhooks_retrieve
      description: 'Retrieve the details for a single, specific webhook subscription, identified by its Rokt Catalog `ID` (UUID) provided in the
        URL path.


        Access is restricted to subscriptions belonging to the authenticated application.


        The response (`RegisteredWebhookSerializer`) includes the `id`, `topic`, and `address`.


        If the provided `ID` is invalid or does not correspond to a webhook registered by your application, a `404 Not Found` error is returned.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredWebhook'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    put:
      tags:
      - webhooks
      summary: Update a webhook
      operationId: webhooks_update
      description: 'Update the configuration of an existing webhook subscription. Identify the subscription by its Rokt Catalog `ID` (UUID) in
        the URL path.


        The request body (`CreateUpdateWebhookSerializer`) can include the new `topic` and/or `address` you want to set. Partial updates are allowed
        (only include the fields you want to change).


        **Validation:** If provided, the `topic` must be one of the valid `WEBHOOK_TOPICS`.


        A successful update returns `200 OK` with the complete, updated details of the webhook subscription (`RegisteredWebhookSerializer`).'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUpdateWebhook'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateUpdateWebhook'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateUpdateWebhook'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredWebhook'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    patch:
      tags:
      - webhooks
      summary: Partially update a webhook
      operationId: webhooks_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRegisteredWebhook'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRegisteredWebhook'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRegisteredWebhook'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredWebhook'
          description: ''
    delete:
      tags:
      - webhooks
      summary: Delete a webhook
      operationId: webhooks_destroy
      description: 'Permanently remove an existing webhook subscription, identified by its Rokt Catalog `ID` (UUID) in the URL path.


        Access is restricted to subscriptions belonging to the authenticated application.


        Once deleted, Catalog will immediately stop sending notifications for the associated `topic` to the registered `address`.


        **Warning:** This action is **irreversible**. To resume receiving notifications, you must create a new subscription.


        A successful deletion returns an HTTP `200 OK` status with an empty response body.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      responses:
        '200':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
components:
  securitySchemes:
    platformAppId:
      type: apiKey
      in: header
      name: X-CANAL-APP-ID
      description: Your Application ID, from Settings > API Credentials in the Rokt Catalog app.
    platformAppToken:
      type: apiKey
      in: header
      name: X-CANAL-APP-TOKEN
      description: Your API Access Token, from Settings > API Credentials in the Rokt Catalog app. Keep it server-side.
  schemas:
    Address:
      type: object
      properties:
        name:
          type: string
        address1:
          type: string
        address2:
          type: string
        city:
          type: string
        province:
          type: string
        province_code:
          type: string
        country:
          type: string
        country_code:
          type: string
        zip:
          type: string
        phone:
          type: string
      required:
      - address1
      - city
      - country
      - name
      - province
      - zip
    BulkCreateSupplierPartnership:
      type: object
      properties:
        canal_contact_emails:
          type: array
          items:
            type: string
            format: email
      required:
      - canal_contact_emails
    ConfirmationDetails:
      type: object
      properties:
        confirmation_number:
          type: string
        catalog_order_id:
          type: string
        order_id:
          type: string
        order_date:
          type: string
          format: date-time
        order_status:
          type: string
        fulfillment_status:
          type: string
        tracking_info:
          type: array
          items:
            type: string
      required:
      - confirmation_number
      - order_date
      - order_id
    CreateFulfillment:
      type: object
      properties:
        name:
          type: string
        service:
          type: string
        shipment_status:
          $ref: '#/components/schemas/ShipmentStatusEnum'
        status:
          $ref: '#/components/schemas/Status406Enum'
        tracking_company:
          type: string
          nullable: true
        tracking_numbers:
          type: array
          items:
            type: string
          nullable: true
        tracking_urls:
          type: array
          items:
            type: string
          nullable: true
        order_id:
          type: string
          format: uuid
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/LineItem'
      required:
      - line_items
      - name
      - order_id
      - service
      - shipment_status
      - status
    CreateOrderLineItem:
      type: object
      properties:
        variant_id:
          type: string
          format: uuid
        quantity:
          type: integer
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
      required:
      - quantity
      - variant_id
    CreateReturnLineItem:
      type: object
      properties:
        line_item_id:
          type: string
          format: uuid
        quantity:
          type: integer
        customer_note:
          type: string
          nullable: true
        return_reason:
          $ref: '#/components/schemas/ReturnReasonEnum'
      required:
      - line_item_id
      - quantity
      - return_reason
    CreateUpdateWebhook:
      type: object
      properties:
        topic:
          type: string
        address:
          type: string
      required:
      - address
      - topic
    CreateVariant:
      type: object
      properties:
        title:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: The price of the variant to be sold at.
        compare_at_price:
          type: string
          format: decimal
