openapi: 3.0.3
info:
  title: Rokt Catalog API
  version: 1.0.1
  description: '# Introduction


    The Rokt Catalog API is the REST interface to Rokt Catalog, the dropship and marketplace

    platform that lets Partners (retailers) sell products supplied by Brands without holding

    inventory. Brands use it to publish products and variants, receive orders, and record

    fulfillments; Partners use it to browse the products they are approved to sell, create and

    manage orders, quote shipping and tax at checkout, and handle refunds and returns. All

    requests go to the production base URL `https://api.shopcanal.com/platform`. There is no

    separate sandbox: test against the designated test Brand accounts from a separate test

    Partner login, as described in the

    [Environments guide](/integration-guides/ecommerce/catalog/environments/).


    # Authentication


    Every request carries two headers: `X-CANAL-APP-ID` (your Application ID) and

    `X-CANAL-APP-TOKEN` (your API Access Token). Both are generated when your account is

    created; find them in the Developer tab under **Settings > API Credentials** after you log

    in to the [Rokt Catalog app](https://app.shopcanal.com/login). Treat the token as a secret:

    keep it server-side and never ship it in a browser or mobile app. See the

    [Authentication guide](/integration-guides/ecommerce/catalog/authentication/).


    # Roles, pagination, and support


    The endpoint descriptions below come from the API code, which uses the older names for the

    two roles: **[Storefront Only]** means the endpoint is for Partner integrations and

    **[Supplier Only]** means it is for Brand integrations. The **Brand integrations** and

    **Partner integrations** groups in the sidebar list the endpoints each role uses; a

    resource that both roles call appears in both groups. List endpoints use cursor-based

    pagination (`cursor` query parameter, `next` and `previous` URLs in the response) and

    accept an `ordering` parameter where noted. Errors return a JSON body: authentication and

    permission errors carry a `detail` field, and most other errors carry a `message` and,

    where relevant, a `detail` field with more information. For the step-by-step integration

    flow, start with the [Rokt Catalog integration guides](/integration-guides/ecommerce/catalog/)

    and the

    [Catalog API overview](/developer-reference/apis/ecommerce/catalog-api/); for anything

    else, contact [roktcatalogsupport@rokt.com](mailto:roktcatalogsupport@rokt.com).

    '
  contact:
    name: Rokt Catalog Support
    email: roktcatalogsupport@rokt.com
servers:
- url: https://api.shopcanal.com/platform
  description: Production
security:
- platformAppId: []
  platformAppToken: []
tags:
- name: products
  x-displayName: Products
  description: The Products endpoints give access to every product you have permission to sell on your Partner storefront, and let Brands create,
    update, reorder, and delete the products they supply. To get permission to sell specific products, send proposals to Brands in the [Rokt Catalog
    app](https://app.shopcanal.com/login); once a Brand approves a proposal, its products become available through these endpoints.
- name: variants
  x-displayName: Variants
  description: Variants are the purchasable options of a product (size, color, SKU, price, inventory). Brands add, update, list, and remove variants
    for their own products; Partners receive variant data on the product and through the `product/create` and `product/update` webhooks.
- name: orders
  x-displayName: Orders
  description: "The Orders endpoints give access to every order containing Brand products that was purchased from your Partner storefront. **Note**:\
    \ only Rokt Catalog Brand products should appear in these orders.\n\n## Order creation example\n\n```bash\ncurl https://api.shopcanal.com/platform/orders/\
    \ \\\n  --request POST \\\n  --header 'Content-Type: application/json' \\\n  --header 'Accept: application/json' \\\n  --header 'x-canal-app-id:\
    \ xxxx-xxxx-xxxx-xxxx' \\\n  --header 'x-canal-app-token: your_api_access_token' \\\n  --data '{\n    \"line_items\": [\n      {\n       \
    \ \"variant_id\": \"0f9e8d7c-6b5a-4433-8211-000000000001\",\n        \"quantity\": 1\n      }\n    ],\n    \"shipping_address\": {\n     \
    \ \"name\": \"John Doe\",\n      \"address1\": \"123 Your St\",\n      \"address2\": \"\",\n      \"city\": \"San Francisco\",\n      \"province\"\
    : \"California\",\n      \"province_code\": \"CA\",\n      \"country\": \"United States of America\",\n      \"country_code\": \"USA\",\n\
    \      \"zip\": \"94111\",\n      \"phone\": \"123-456-7890\"\n    },\n    \"customer\": {\n      \"email\": \"john.doe@example.com\",\n \
    \     \"first_name\": \"John\",\n      \"last_name\": \"Doe\"\n    }\n  }'\n```\n"
- name: shops
  x-displayName: Shops
  description: Shops are the Brand accounts connected to your Partner storefront. List your active connections, retrieve a connected Brand, or
    request new connections by Brand contact email.
- name: fulfillments
  x-displayName: Fulfillments
  description: 'The Fulfillments endpoints give access to the latest shipping information for Brand orders placed through your Partner storefront.
    Brands create and update fulfillment (shipment) records; Partners list and retrieve them to show tracking to their customers. **Note**: only
    Rokt Catalog Brand products should appear in these fulfillments.'
- name: refunds
  x-displayName: Refunds
  description: The Refunds endpoints allow the Partner to initiate refunds for Brand products that were bought through the Partner storefront.
    Brands can also create refunds for orders they received, and both roles can list and retrieve refunds.
- name: returns
  x-displayName: Returns
  description: 'Partners create return requests for items purchased in a Rokt Catalog order and add tracking for the return shipment; Brands review
    the return requests they receive and close them once the returned items have been processed. Closing a return does not create a refund: use
    the Refunds endpoints for that.'
- name: shipping-rates
  x-displayName: Shipping rates
  description: The Shipping Rates endpoints allow the Partner to determine how much to charge for shipping Brand products that are bought through
    the Partner storefront. Rokt Catalog charges the Partner this amount for shipping and passes it to the Brand. An empty list is returned when
    the line items cannot be shipped to the given location.
- name: max-shipping-rates
  x-displayName: Max shipping rates
  description: Estimate the highest shipping cost for a set of line items before the customer has entered an address, for "Shipping from" style
    displays on a product page.
- name: tax
  x-displayName: Tax
  description: Calculate estimated tax lines for a set of line items and a shipping address.
- name: tax-and-shipping
  x-displayName: Tax and shipping
  description: Calculate estimated tax lines and available shipping options in a single call during checkout, once the customer has provided a
    shipping address. See [Calculating Tax and Shipping for Shoppable Ads](/developer-reference/product-deep-dives/shoppable-ads/tax-and-shipping/).
- name: webhooks
  x-displayName: Webhooks
  description: Register and manage webhook subscriptions so Rokt Catalog can notify your application when products, orders, and fulfillments change.
    See the [Webhooks guide](/integration-guides/ecommerce/catalog/webhooks/) for the available topics, payloads, and delivery behavior.
- name: csv
  x-displayName: CSV
  description: 'CSV downloads: the product import template, and line-item exports for Partners and Brands. These endpoints back the upload and
    export flows in the Rokt Catalog app and expect a signed-in app session; use the Products and Variants endpoints with the API headers for
    programmatic catalog changes.'
- name: markets
  x-displayName: Markets
  description: Import market-specific prices for your products. These endpoints back the upload and export flows in the Rokt Catalog app and expect
    a signed-in app session; use the Products and Variants endpoints with the API headers for programmatic catalog changes.
x-tagGroups:
- name: Brand integrations
  tags:
  - products
  - variants
  - fulfillments
  - refunds
  - returns
  - webhooks
  - csv
  - markets
- name: Partner integrations
  tags:
  - orders
  - products
  - shops
  - shipping-rates
  - max-shipping-rates
  - tax
  - tax-and-shipping
  - fulfillments
  - refunds
  - returns
  - webhooks
  - csv
paths:
  /csv/download_shopkeep_line_items/:
    get:
      tags:
      - csv
      summary: Download Partner line items CSV
      operationId: csv_download_shopkeep_line_items_retrieve
      description: Backs the corresponding flow in the Rokt Catalog app and expects a signed-in app session; the API headers alone do not authenticate
        this operation.
      responses:
        '200':
          description: No response body
  /csv/download_unfulfilled_supplier_line_items/:
    get:
      tags:
      - csv
      summary: Download unfulfilled Brand line items CSV
      operationId: csv_download_unfulfilled_supplier_line_items_retrieve
      description: Backs the corresponding flow in the Rokt Catalog app and expects a signed-in app session; the API headers alone do not authenticate
        this operation.
      responses:
        '200':
          description: No response body
  /csv/product/template/:
    get:
      tags:
      - csv
      summary: Download the product CSV template
      operationId: csv_product_template_retrieve
      description: Backs the corresponding flow in the Rokt Catalog app and expects a signed-in app session; the API headers alone do not authenticate
        this operation.
      responses:
        '200':
          description: No response body
  /fulfillments/:
    get:
      tags:
      - fulfillments
      summary: List fulfillments
      operationId: fulfillments_list
      description: 'Retrieve a paginated list of fulfillment records associated with the authenticated store, reflecting its role in the order
        process.


        - **If called by a Storefront:** Returns fulfillments created by connected Suppliers for orders originating from the Storefront. This
        allows the Storefront to track shipments for items their customers ordered.


        - **If called by a Supplier:** Returns fulfillments created *by* this Supplier for orders they received from connected Storefronts.


        Results (`FulfillmentSerializer`) include tracking details when present, status, associated line items, and timestamps.


        Pagination is cursor-based (`PlatformPagination`). Ordering is available on `created_at` and `updated_at`, defaulting to `-created_at`.'
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFulfillmentList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    post:
      tags:
      - fulfillments
      summary: Create a fulfillment
      operationId: fulfillments_create
      description: '**[Supplier Only]** Create a fulfillment record for items in an order received from a connected Storefront.


        The request body (`CreateFulfillmentSerializer`) must specify:


        `order_id` (UUID of the *Supplier''s* Rokt Catalog order record) and a list of `line_items`.


        Each object in `line_items` needs the Catalog `id` (UUID) of the *Supplier''s* line item record and the `quantity` being fulfilled.


        For physical shipments, include tracking information (`tracking_company`, `tracking_numbers`, `tracking_urls`) when available. For digital/email
        fulfillment with no shipment, omit the tracking fields.


        **Process:**


        1. **Validation:** Checks if the order exists, belongs to the Supplier, is a connected order, and if the provided line items are valid.
        Returns `400 Bad Request` or `404 Not Found` on failure.


        2. **Create Supplier Fulfillment:** Creates the fulfillment record associated with the Supplier''s order in Catalog. Considers feature
        flags to determine if the `notify_customer` flag should be set during downstream sync.


        3. **Sync to Storefront:** Triggers a synchronization process. This attempts to create or update the corresponding fulfillment record
        on the original Storefront''s order (e.g., via Shopify API), including tracking information when present.


        4. **Webhook:** Emits a `FULFILLMENT_UPDATE` webhook event containing details of the **Supplier''s** newly created fulfillment record.


        A successful creation returns `201 Created` with the details of the Supplier''s fulfillment record (`FulfillmentSerializer`).'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFulfillment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateFulfillment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateFulfillment'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fulfillment'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /fulfillments/{id}/:
    get:
      tags:
      - fulfillments
      summary: Retrieve a fulfillment
      operationId: fulfillments_retrieve
      description: 'Retrieve the full details for a specific fulfillment record, identified by its Rokt Catalog `ID` (UUID) in the URL path.


        Access is restricted to fulfillments associated with the authenticated store (`request.shop`). This means:


        - **Storefronts** can retrieve details of fulfillments created by their Suppliers for their orders.


        - **Suppliers** can retrieve details of fulfillments they created.


        The response (`FulfillmentSerializer`) includes the fulfillment `status` (e.g., ''fulfilled'', ''cancelled''), optional `tracking_company`,
        optional `tracking_numbers`, optional `tracking_urls`, the list of `line_items` included in this fulfillment (with quantities), and relevant
        timestamps.


        If the fulfillment `ID` is invalid or not associated with an order linked to your store, a `404 Not Found` error is returned.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fulfillment'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    put:
      tags:
      - fulfillments
      summary: Update a fulfillment
      operationId: fulfillments_update
      description: '**[Supplier Only]** Update an existing fulfillment record created by your Supplier account. Identify the fulfillment by its
        Rokt Catalog `ID` (UUID) in the URL path.


        The request body (`UpdateFulfillmentSerializer`) should contain the fields to update, such as `tracking_company`, `tracking_numbers`,
        and/or `tracking_urls` for physical shipments. Tracking fields are optional and can be omitted for digital/email fulfillments with no
        shipment. Partial updates are allowed (only include the fields you want to change).


        **Process:**


        1. **Update Supplier Fulfillment:** Updates the specified fields on the Supplier''s fulfillment record in Catalog.


        2. **Sync to Storefront:** Triggers a synchronization process. This attempts to update the corresponding fulfillment record on the original
        Storefront''s order (e.g., via Shopify API) with the new tracking information when present.


        3. **Webhook:** Emits a `FULFILLMENT_UPDATE` webhook event containing details of the **Supplier''s** updated fulfillment record. If the
        sync to the Storefront also resulted in an update to the Storefront''s fulfillment record in Catalog, a separate `FULFILLMENT_UPDATE`
        event for the **Storefront''s** fulfillment might also be emitted (depending on the sync logic).


        A successful update returns `200 OK` with the updated details of the Supplier''s fulfillment record (`FulfillmentSerializer`).'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFulfillment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateFulfillment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateFulfillment'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fulfillment'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    patch:
      tags:
      - fulfillments
      summary: Partially update a fulfillment
      operationId: fulfillments_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFulfillment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFulfillment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFulfillment'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fulfillment'
          description: ''
  /markets/prices/import/:
    post:
      tags:
      - markets
      summary: Import market prices
      operationId: markets_prices_import_create
      description: Backs the corresponding flow in the Rokt Catalog app and expects a signed-in app session; the API headers alone do not authenticate
        this operation.
      responses:
        '200':
          description: No response body
  /max-shipping-rates/:
    post:
      tags:
      - max-shipping-rates
      summary: Estimate max shipping rates
      operationId: max_shipping_rates_create
      description: "**[Storefront Only]** Provide a rough, potentially overestimated shipping cost for a set of line items, useful for display\
        \ *before* a customer provides their full address (e.g., showing 'Shipping from $X' on a product page).\n\n**Request Body (`MaxShippingQuerySerializer`):**\n\
        \n- `line_items` (list, required): A list of objects, each specifying:\n\n  - `variant_id` (UUID, required): The Rokt Catalog ID of the\
        \ *Storefront's* variant record.\n\n  - `quantity` (integer, required): The quantity of this variant.\n\n**Process:**\n\n1. **Default\
        \ Address:** This endpoint **ignores** any address provided and instead uses a **hardcoded default address** (currently hardcoded to San\
        \ Francisco, CA: 655 Montgomery St, 94111).\n\n2. **Query Suppliers:** It queries the relevant Suppliers for shipping rates to this *default*\
        \ address using the provided `line_items`.\n\n3. **Find Maximum:** It identifies the **single highest shipping rate** returned across\
        \ all involved Suppliers for the default address.\n\n**Response (`ShippingRateResponseSerializer`):**\n\n- `rates` (list): Typically contains\
        \ **only one** rate object representing the maximum cost found for the default address. The object includes `title` and `price` (Money\
        \ object).\n\n**Disclaimer:** This is an **estimate** based on a fixed location. The actual shipping cost calculated using the customer's\
        \ real address via the `/shipping_rates` endpoint during checkout may be significantly different (higher or lower)."
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaxShippingQuery'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MaxShippingQuery'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MaxShippingQuery'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingRateResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /orders/:
    get:
      tags:
      - orders
      summary: List orders
      operationId: orders_list
      description: '**[Storefront Only]** Retrieve a paginated list of orders recorded in Rokt Catalog that originated from your Storefront and
        contain items sourced from Catalog Suppliers.


        This provides your Storefront''s view of these cross-shop orders.


        Results are returned using cursor-based pagination (`PlatformPagination`). Available ordering fields are `created_at` and `updated_at`.
        The default order is `-created_at`.'
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    post:
      tags:
      - orders
      summary: Create an order
      operationId: orders_create
      description: "**[Storefront Only]** Record a new customer order placed on your external platform (e.g., your Shopify store) that contains\
        \ items sourced from Rokt Catalog Suppliers.\n\nThe request body (`OrderCreateSerializer`) must include:\n\n`order_name` (your unique\
        \ identifier for this order), `currency`, `email`, `customer_locale`, `shipping_address` (full address object), `billing_address` (optional),\
        \ and a list of `line_items`.\n\nEach object in `line_items` requires the Catalog `variant_id` (UUID of the *Storefront's* variant record,\
        \ which links to the Supplier variant) and `quantity`.\n\n**Process:**\n\n1. **Validation:** Checks if input variants are valid, active,\
        \ and listed by the supplier. If variants are paused or unlisted, returns `422 Unprocessable Entity`. Basic format validation returns\
        \ `400 Bad Request`.\n\n2. **Locking:** Acquires a temporary lock based on customer name/phone to prevent duplicate order creation during\
        \ concurrent requests. If lock fails, returns `503 Service Unavailable`.\n\n3. **Storefront Order Creation:** Creates the primary order\
        \ record in Catalog representing the Storefront's view of the order.\n\n4. **Supplier Order Dispatch:** Based on the Storefront's `order_forwarding_delay`\
        \ setting:\n\n   - If delay > 0: Schedules an **asynchronous** task to forward order details to relevant Suppliers after the delay. Returns\
        \ `202 Accepted` with the created Storefront order data.\n\n   - If delay == 0: **Synchronously** attempts to dispatch orders to Suppliers.\
        \ If successful, returns `201 Created` with Storefront order data. If dispatch fails (e.g., Supplier API issue), attempts to cancel any\
        \ partially created Supplier orders and raises an error (likely resulting in a `500 Internal Server Error` response).\n\n**Error Handling:**\
        \ Catches various exceptions, including dispatch errors, database connection issues, and general exceptions, logging them and potentially\
        \ returning `500 Internal Server Error`."
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrderCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrderCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /orders/{id}/:
    get:
      tags:
      - orders
      summary: Retrieve an order
      operationId: orders_retrieve
      description: '**[Storefront Only]** Retrieve the full details for a specific Rokt Catalog order, identified by its Catalog `ID` (UUID) in
        the URL path.


        This endpoint provides the Storefront''s perspective on the order. Access is restricted to orders associated with the authenticated Storefront
        (`request.shop`).


        The response (`OrderSerializer`) includes comprehensive information: customer details (`email`, `customer_locale`), `shipping_address`,
        `billing_address`, `currency`, `order_name`, `line_items` (with Catalog variant IDs and quantities), overall `fulfillment_status`, `financial_status`,
        `cancelled_at` timestamp (if applicable), calculated totals (`total_price`, `subtotal_price`, etc.), and potentially links or references
        to the corresponding connected orders created on the Supplier side.


        If the provided order `ID` is invalid or the order does not belong to your Storefront, a `404 Not Found` error is returned.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
