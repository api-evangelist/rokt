      operationId: refunds_list
      description: 'Retrieve a paginated list of refund records associated with the authenticated store, reflecting its role in the order process.


        - **If called by a Storefront:** Returns refund records linked to orders originating from the Storefront. This includes refunds initiated
        *by* the Storefront and refunds initiated *by* connected Suppliers for those orders.


