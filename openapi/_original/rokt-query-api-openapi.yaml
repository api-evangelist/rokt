openapi: 3.0.0
info:
  description: >
    # Introduction

    The Rokt Query API is a comprehensive and flexible API for querying account
    data,

    campaigns, and transactions.


    # Authentication

    The Rokt Query API leverages the OAuth 2.0 approach to client integration. 

    See the [OAuth 2.0 Credentials
    Flow](https://auth0.com/docs/flows/client-credentials-flow) for more
    details. 

    You need to use your Rokt App ID and App Secret to access the Query API.


    ## Generating a Rokt App ID and App Secret


    1. Sign in to One Platform at [my.rokt.com](https://my.rokt.com)

    2. Navigate to **Profile Settings** under your account icon at the bottom
    left

    3. Scroll down to the **Generate Personal API Credentials** section

    4. Enter the name of your app and click **Generate**

    5. Store the App ID and App Secret securely - you will not have access to
    the App Secret again


    ## Generating an Access Token


    Rokt uses OAuth 2.0 for secure authentication to our public APIs. This is to
    ensure that only authorized users can access their data.


    To generate an access token, make the following POST request.


    ```cURL

    curl -X POST https://api.rokt.com/auth/oauth2/token \

    --header "Authorization: Basic $ENCODED_TOKEN" \

    --header "Content-Type: application/x-www-form-urlencoded" \

    --data "grant_type=client_credentials"

    ```


    The access token expires after one hour, and must be included as a Bearer
    token in all API requests.


    ### Step-by-Step Example


    Here's a complete example using shell commands:

    ```bash

    # Step 1: Set your environment variables. Do not store these in version
    control

    export ROKT_APP_ID="your_app_id"

    export ROKT_APP_SECRET="your_secret"


    # Step 2: Encode your credentials to generate an auth token

    export ENCODED_TOKEN=$(printf '%s' "${ROKT_APP_ID}:${ROKT_APP_SECRET}" |
    openssl base64 | tr -d '\n')


    # Step 3: Request OAuth2/Bearer token using Basic Auth with the encoded
    token

    BEARER_TOKEN=$(curl -s -X POST https://api.rokt.com/auth/oauth2/token      
    -H "Authorization: Basic $ENCODED_TOKEN"       -H "Content-Type:
    application/x-www-form-urlencoded"       -d "grant_type=client_credentials"
    | jq -r '.access_token')


    # Step 4: Use the Bearer token in Query API requests

    curl -X GET "https://api.rokt.com/v1/query/accounts" \
      --header 'Content-Type: application/json' \
      --header "Authorization: Bearer $BEARER_TOKEN"
    ```


    ## Important Notes

    - Always use environment variables for credentials to avoid exposing them in
    scripts or version control

    - The `printf` command with `openssl base64` ensures proper encoding without
    newline characters

    - Store the access token securely as it provides full API access until
    expiration


    # Rate Limiting

    API requests are rate-limited to ensure fair usage and system stability.


    # Error Handling

    The API returns standardized error responses with appropriate HTTP status
    codes.
