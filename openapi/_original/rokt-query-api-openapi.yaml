paths:
  /v1/query/accounts/:
    get:
      tags:
        - accounts
      summary: Get User Accounts
      description: >-
        Retrieve all accounts associated with the authenticated user.


        This endpoint returns a list of all accounts that the authenticated

        user has access to.

        The response includes account details such as account ID, name, country,
        currency,

        and timezone information.


        ## Authentication

        Requires a valid Bearer token from a user's Rokt JWT or encoded OAuth2
        token.

        For more information about authenticating with our API, see the

        [Authentication](https://docs.rokt.com/developer-reference/apis/reporting-apis/query-api/api-reference/#section/Authentication)

        documentation.


        ## Response

        Returns a list of account objects with the following structure:

        - `accountId`: Unique identifier for the account

        - `accountName`: Display name of the account

        - `countryCode`: ISO country code for the account

        - `accountOwner`: Email address of the account owner (optional)

        - `accountCurrencyCode`: Currency code for the account

        - `accountTimezone`: Timezone name for the account

        - `accountTimezoneOffset`: Timezone offset in minutes


        ## Error Responses

        - `401 Unauthorized`: Failed to authenticate. Invalid token.

        - `404 Not Found`: User does not have any accounts

        - `500 Internal Server Error`: Server error while retrieving accounts


        ## Example Response

        ```json

        [
            {
                "accountId": "acc_123456789",
                "accountName": "Example Account 1",
                "countryCode": "US",
                "accountOwner": "user@example.com",
                "accountCurrencyCode": "USD",
                "accountTimezone": "America/New_York",
                "accountTimezoneOffset": -300
            },
            {
                "accountId": "acc_123456790",
                "accountName": "Example Account 2",
                "countryCode": "AU",
                "accountOwner": "user@example.com",
                "accountCurrencyCode": "AUD",
                "accountTimezone": "Australia/Sydney",
                "accountTimezoneOffset": 600
            }
        ]

        ```
      operationId: get_user_accounts_v1_query_accounts__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AccountExternal'
                type: array
                title: Response Get User Accounts V1 Query Accounts  Get
        '401':
          description: Failed to authenticate. Invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: User does not have any accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '500':
          description: >-
            An unexpected error occurred. Please validate your request is
            correct and try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /v1/query/accounts/{account_id}:
    get:
      tags:
        - accounts
      summary: Get Account
      description: >-
        Retrieve detailed information for a specific account.


        This endpoint returns detailed information about a specific account
        identified

        by the account_id parameter.

        The user must have access permissions to the specified account.


        ## Parameters

        - `accountId` (path): The unique identifier of the account to retrieve


        ## Authentication

        Requires a valid Bearer token from a user's Rokt JWT or encoded OAuth2
        token.

        For more information about authenticating with our API, see the

        [Authentication](https://docs.rokt.com/developer-reference/apis/reporting-apis/query-api/api-reference/#section/Authentication)

        documentation.

        The user must have access permissions to the specified account and
        campaign data.


        ## Response

        Returns a single account object with the following structure:

        - `accountId`: Unique identifier for the account

        - `accountName`: Display name of the account

        - `countryCode`: ISO country code for the account

        - `accountOwner`: Email address of the account owner (optional)

        - `accountCurrencyCode`: Currency code for the account

        - `accountTimezone`: Timezone name for the account

        - `accountTimezoneOffset`: Timezone offset in minutes


        ## Error Responses

        - `401 Unauthorized`: Failed to authenticate. Invalid token.

        - `403 Forbidden`: User does not have access to the specified account

        - `404 Not Found`: Account with the specified ID does not exist

        - `500 Internal Server Error`: Server error while retrieving account


        ## Example Request

        ```

        GET /v1/query/accounts/acc_123456789

        ```


        ## Example Response

        ```json

        {
            "accountId": "acc_123456789",
            "accountName": "Example Account 1",
            "countryCode": "US",
            "accountOwner": "user@example.com",
            "accountCurrencyCode": "USD",
            "accountTimezone": "America/New_York",
            "accountTimezoneOffset": -300
        }

        ```
      operationId: get_account_v1_query_accounts__account_id__get
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: integer
            title: Account Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountExternal'
        '401':
          description: Failed to authenticate. Invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '403':
          description: User does not have access to the specified account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: Account with the specified ID does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: >-
            An unexpected error occurred. Please validate your request is
            correct and try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /v1/query/accounts/{account_id}/campaigns/:
    post:
      tags:
        - campaigns
      summary: Get Advertiser Report
      description: >-
        Generate a comprehensive campaign report for the specified account.


        This endpoint allows you to query campaign performance data with
        flexible filtering,

        metrics selection, and date range specification. The response includes
        aggregated

        campaign data based on your specified criteria.


        ## Parameters

        - `account_id` (path): The unique identifier of the account for which

        to generate the report


        ## Request Body

        The request body should contain a `ReportingRequestExternal` object

        with the following fields:

        - `timezoneVariation` (string, optional): Timezone for the report data

        (default: "America/New_York")

        - `currencyCode` (string, optional): Currency code for the report data

        (default: "USD")

        - `interval` (string, optional): Time interval for the report data.

        Options: "day", "week", "month", "year"

        - `startDate` (string): Start date for the report period in ISO format
        (inclusive).

        Accepts both YYYY-MM-DD and YYYY-MM-DD HH:MM:SS

        - `endDate` (string): End date for the report period in ISO format
        (exclusive).

        Accepts both YYYY-MM-DD and YYYY-MM-DD HH:MM:SS

        - `dimensionFilters` (object, optional): Filters to apply to specific
        dimensions

        - `metrics` (array): List of metrics to include in the report. 

        For available metrics, use the slugs returned from the `get_help`
        endpoint.

        - `dimensions` (array, optional): Dimensions to group the data by.

        For available dimensions, use the slugs returned from the `get_help`
        endpoint.

        - `orderBys` (array, optional): Sorting criteria for the results.

        Accepts both "column" and "direction" keys.

        - `limit` (integer, optional): Maximum number of results to return


        ## Authentication

        Requires either a valid JWT Bearer token or Cognito token in the request
        headers.

        For more information about authenticating with our API, see the

        [Authentication](https://docs.rokt.com/developer-reference/apis/reporting-apis/query-api/#authentication)

        documentation.

        The user must have access permissions to the specified account and
        campaign data.


        ## Response

        Returns a `ReportingResponseExternal` object containing:

        - `data`: Array of requested campaign metrics and dimensions.

        If interval is provided, each object will contain a `datetime` field

        denoting the start of the provided interval.

        - `accountId`: The account ID for which the report was generated

        - `queryTimeMs`: Query execution time in milliseconds


        ## Error Responses

        - `400 Bad Request`: Invalid request parameters or filters

        - `401 Unauthorized`: Failed to authenticate. Invalid token.

        - `403 Forbidden`: User does not have access to the specified account

        - `404 Not Found`: The requested resource was not found.
            Please validate your request is correct and try again.
        - `500 Internal Server Error`: Server error while generating report


        ## Example Request

        ```json

        {
            "timezoneVariation": "America/New_York",
            "currencyCode": "USD",
            "interval": "day",
            "startDate": "2025-03-04",
            "endDate": "2025-03-05",
            "dimensionFilters": {
                "campaign_id": ["3427232771076128951"]
            },
            "metrics": ["impressions", "referrals", "gross_cost"],
            "dimensions": ["campaign_id", "creative_id", "age_group"],
            "orderBys": [
                {
                    "column": "referrals",
                    "direction": "desc"
                }
            ]
        }

        ```


        ## Example Response

        ```json

        {
            "data": [
                {
                    "datetime": "2025-03-04T00:00:00Z",
                    "impressions": 1501.0,
                    "referrals": 205.0,
                    "gross_cost": 410.05,
                    "campaign_id": "3427232771076128951",
                    "creative_id": "3427232968644886703",
                    "age_group": "26-35"
                },
                {
                    "datetime": "2025-03-04T00:00:00Z",
                    "impressions": 1220.0,
                    "referrals": 180.0,
                    "gross_cost": 300.00,
                    "campaign_id": "3401676908203081730",
                    "creative_id": "3404563830614458492",
                    "age_group": "36-45"
                }
            ],
            "accountId": "3286272607917027328",
            "queryTimeMs": 206
            }
        ```
      operationId: get_advertiser_report_v1_query_accounts__account_id__campaigns__post
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: integer
            title: Account Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportingRequestExternal'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportingResponseExternal'
        '400':
          description: Invalid request parameters or filters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          description: Failed to authenticate. Invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: >-
            The requested resource was not found. Please validate your request
            is correct and try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Server error while generating report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /v1/query/accounts/{account_id}/campaigns/help:
    get:
      tags:
        - campaigns
      summary: Get Help
      description: >-
        Retrieve available metrics and dimensions for campaign reporting.


        This endpoint returns metadata about the available reporting options,
        including

        which metrics and dimensions can be used together, their display names,
        and

        any additional configuration options.


        ## Parameters

        - `account_id` (path): The unique identifier of the account

        (used for access validation)


        ## Authentication

        Requires a valid Bearer token from a user's Rokt JWT or encoded OAuth2
        token.

        For more information about authenticating with our API, see the

        [Authentication](https://docs.rokt.com/developer-reference/apis/reporting-apis/query-api/api-reference/#section/Authentication)

        documentation.

        The user must have access permissions to the specified account and
        campaign data.


        ## Response

        Returns a `ReportingMetadataExternal` object containing:

        - `dimensions`: List of dimensions with their slugs and descriptions

        - `metrics`: List of metrics with their slugs and descriptions


        ## Error Responses

        - `401 Unauthorized`: Failed to authenticate. Invalid token.

        - `403 Forbidden`: User does not have access to the specified account

        - `404 Not Found`: The requested resource was not found.
            Please validate your request is correct and try again.
        - `500 Internal Server Error`: Server error while retrieving metadata


        ## Example Response

        ```json

        {
          "dimensions": [
              {
                  "slug": "age_range",
                  "description": "The age range of the user"
              },
              {
                  "slug": "campaign_id",
                  "description": "The ID of the campaign"
              },
              {
                  "slug": "creative_id",
                  "description": "The ID of the creative"
              },
              {
                  "slug": "device",
                  "description": "The device of the user"
              },
          ],
          "metrics": [
              {
                  "slug": "impressions",
                  "description": "The number of ad impressions"
              },
              {
                  "slug": "referrals",
                  "description": "The number of positive engagements with the ad"
              },
              {
                  "slug": "clickthru_acquisitions",
                  "description": "The number of click-thru acquisitions for the ad.
                  An acquisition represents the first conversion
                  following an engagement event."
              },
              {
                  "slug": "cpa",
                  "description": "The Cost per Acquisition for the ad"
              },
              {
                  "slug": "gross_cost",
                  "description": "The gross cost (spend) for the ad"
              },
          ]
        }

        ```
      operationId: get_help_v1_query_accounts__account_id__campaigns_help_get
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: integer
            title: Account Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportingMetadataExternal'
        '401':
          description: Failed to authenticate. Invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: >-
            The requested resource was not found. Please validate your request
            is correct and try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Server error while generating report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
