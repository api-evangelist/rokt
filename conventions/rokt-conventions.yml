generated: '2026-10-21'
method: searched
source:
- https://docs.rokt.com/developer-reference/apis/partnerships-api/authentication/
- https://docs.rokt.com/developer-reference/apis/partnerships-api/concepts/idempotency/
- https://docs.rokt.com/developer-reference/apis/partnerships-api/concepts/dry-run/
- https://docs.rokt.com/developer-reference/apis/partnerships-api/errors/
- https://docs.rokt.com/developer-reference/apis/partnerships-api/rate-limits/
- https://docs.rokt.com/developer-reference/apis/partnerships-api/concepts/operation-polling/
- https://docs.rokt.com/developer-reference/apis/partnerships-api/workflows/pausing-resuming/
- https://docs.rokt.com/developer-reference/apis/reporting-apis/query-api/
